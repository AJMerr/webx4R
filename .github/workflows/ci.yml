name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: build, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Install Pebble, a test ACME CA, and its DNS server
        if: runner.os == 'Linux'
        run: |
          for tool in pebble pebble-challtestsrv; do
            curl -sSfL "https://github.com/letsencrypt/pebble/releases/download/v2.10.1/$tool-linux-amd64.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP" --strip-components=3
          done
          # The release archives don't mark the binaries executable.
          chmod +x "$RUNNER_TEMP/pebble" "$RUNNER_TEMP/pebble-challtestsrv"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Tests that need Pebble
        if: runner.os == 'Linux'
        run: cargo test --workspace --locked -- --ignored
