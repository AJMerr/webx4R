[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AJMerr/webx4R"
publish = false

[workspace.dependencies]
webxlib = { path = "crates/webxlib" }
webxcore = { path = "crates/webxcore" }
bytes = "1.12.1"
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
futures-core = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
httpdate = "1.0.3"
mime_guess = { version = "2.0.5", default-features = false }
percent-encoding = "2.3.2"
tempfile = "3.27.0"
tokio = "1.53.3"
tokio-util = "0.7.20"
