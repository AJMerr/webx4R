[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AJMerr/webx4R"
publish = false

[workspace.dependencies]
webxlib = { path = "crates/webxlib" }
webxcore = { path = "crates/webxcore" }
arc-swap = "1.9.3"
bytes = "1.12.1"
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
clap = { version = "4.6.7", features = ["derive"] }
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false }
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
httpdate = "1.0.3"
hyper = "1.12.0"
hyper-util = "0.1.21"
instant-acme = { version = "0.8.5", features = ["rcgen"] }
mime_guess = { version = "2.0.5", default-features = false }
percent-encoding = "2.3.2"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = "1.53.3"
tokio-rustls = "0.26.6"
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
x509-parser = "0.18.1"
